<div class="min-h-screen flex items-center justify-center bg-gray-100 px-4">
  <div class="w-full max-w-sm bg-white rounded-xl shadow-md p-8">
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold text-brand-600">Minute Burger</h1>
      <p class="text-sm text-gray-500 mt-1">Store Inventory System</p>
    </div>

    <form (ngSubmit)="submit()" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Store Branch</label>

        <select
          *ngIf="!isLoadingBranches"
          [(ngModel)]="selectedBranchId"
          name="branchId"
          class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-brand-500"
        >
          <option [ngValue]="null" disabled>Select your branch</option>
          <option *ngFor="let branch of branches" [ngValue]="branch.id">
            {{ branch.name }}
          </option>
        </select>

        <p *ngIf="isLoadingBranches" class="text-sm text-gray-400">Loading branches...</p>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Store Code</label>
        <input
          type="password"
          [(ngModel)]="storeCode"
          name="storeCode"
          placeholder="Enter store code"
          class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-brand-500"
        />
      </div>

      <p *ngIf="errorMessage" class="text-sm text-red-600">{{ errorMessage }}</p>

      <button
        type="submit"
        [disabled]="isSubmitting"
        class="w-full bg-brand-600 hover:bg-brand-700 disabled:opacity-50 text-white font-semibold py-2.5 rounded-lg transition"
      >
        {{ isSubmitting ? 'Logging in...' : 'Login' }}
      </button>
    </form>
  </div>
</div>
