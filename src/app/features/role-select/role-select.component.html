<div class="min-h-screen flex items-center justify-center bg-gray-50 px-4 py-6 sm:py-8">
  <div class="w-full max-w-3xl flex flex-col md:flex-row bg-white rounded-2xl md:rounded-3xl shadow-xl ring-1 ring-black/5 overflow-hidden">

    <!-- Mobile header (hidden on desktop) -->
    <div class="md:hidden relative overflow-hidden bg-gradient-to-br from-brand-700 to-brand-600 px-5 py-5 text-white">
      <div class="pointer-events-none absolute -top-10 -right-10 h-32 w-32 rounded-full bg-white/10"></div>
      <div class="relative flex items-center gap-3">
        <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-white/15 ring-1 ring-white/25">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 9l1.5-5h15L21 9" />
            <path d="M4 9v11h16V9" />
            <path d="M3 9a3 3 0 006 0 3 3 0 006 0 3 3 0 006 0" />
          </svg>
        </div>
        <div>
          <p class="text-lg font-extrabold leading-tight tracking-tight">Minute Burger</p>
          <p class="text-xs text-white/75">Store Inventory System</p>
        </div>
      </div>
    </div>

    <!-- Left brand panel (hidden on mobile) -->
    <aside class="hidden md:flex md:w-[40%] relative flex-col justify-between overflow-hidden bg-gradient-to-br from-brand-700 to-brand-600 p-7 text-white">
      <div class="pointer-events-none absolute -top-16 -right-16 h-56 w-56 rounded-full bg-white/10"></div>
      <div class="pointer-events-none absolute -bottom-20 -left-12 h-56 w-56 rounded-full bg-black/10"></div>

      <div class="relative">
        <div class="flex h-11 w-11 items-center justify-center rounded-xl bg-white/15 ring-1 ring-white/25">
          <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 9l1.5-5h15L21 9" />
            <path d="M4 9v11h16V9" />
            <path d="M3 9a3 3 0 006 0 3 3 0 006 0 3 3 0 006 0" />
          </svg>
        </div>

        <p class="mt-6 text-xs font-semibold tracking-widest uppercase text-white/70">Minute Burger</p>
        <h1 class="mt-2 text-2xl font-extrabold leading-tight tracking-tight">
          Your store inventory, all in one place.
        </h1>
        <p class="mt-3 text-sm text-white/75">
          Track stock and manage your branch without the paperwork.
        </p>
      </div>

      <ul class="relative mt-8 space-y-3 text-sm font-medium">
        <li class="flex items-center gap-3">
          <span class="flex h-8 w-8 items-center justify-center rounded-lg bg-white/15">
            <svg class="w-4 h-4" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M4 3a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V5a2 2 0 00-2-2H4zm2 4h8v2H6V7zm0 4h5v2H6v-2z" /></svg>
          </span>
          Daily stock counts
        </li>
        <li class="flex items-center gap-3">
          <span class="flex h-8 w-8 items-center justify-center rounded-lg bg-white/15">
            <svg class="w-4 h-4" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M10 2L2 6v2h16V6l-8-4zM4 10v6H2v2h16v-2h-2v-6h-2v6h-2v-6H10v6H8v-6H6v6H4v-6z" /></svg>
          </span>
          Branch inventory
        </li>
        <li class="flex items-center gap-3">
          <span class="flex h-8 w-8 items-center justify-center rounded-lg bg-white/15">
            <svg class="w-4 h-4" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M10 2a4 4 0 00-4 4v2H5a2 2 0 00-2 2v6a2 2 0 002 2h10a2 2 0 002-2v-6a2 2 0 00-2-2h-1V6a4 4 0 00-4-4zm2 6V6a2 2 0 10-4 0v2h4z" clip-rule="evenodd" /></svg>
          </span>
          Role-based access
        </li>
      </ul>
    </aside>

    <!-- Right role panel -->
    <section class="flex-1 flex flex-col justify-center px-5 py-6 sm:px-8 sm:py-9">

      <h2 class="text-2xl font-bold tracking-tight text-gray-900">Choose your role</h2>
      <p class="mt-1 text-sm text-gray-500">Select how you'll be signing in.</p>

      <div class="mt-6 space-y-3">
        <button
          type="button"
          (click)="goTo('/login/crew')"
          class="group w-full flex items-center gap-4 text-left rounded-xl border border-gray-200 bg-gray-50 px-4 py-3.5 transition hover:border-brand-500 hover:bg-brand-50 active:bg-brand-50 focus:outline-none focus-visible:ring-2 focus-visible:ring-brand-500"
        >
          <span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg bg-white text-gray-500 ring-1 ring-gray-200 transition group-hover:bg-brand-600 group-hover:text-white group-hover:ring-brand-600">
            <svg class="w-5 h-5" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
              <path d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" />
            </svg>
          </span>
          <span class="flex-1 min-w-0">
            <span class="block font-semibold text-gray-900">Crew</span>
            <span class="block text-sm text-gray-500">Record daily stock</span>
          </span>
          <svg class="w-4 h-4 text-gray-300 transition group-hover:text-brand-600" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
            <path fill-rule="evenodd" d="M7.3 15.7a1 1 0 010-1.4L11.6 10 7.3 5.7a1 1 0 011.4-1.4l5 5a1 1 0 010 1.4l-5 5a1 1 0 01-1.4 0z" clip-rule="evenodd" />
          </svg>
        </button>

        <button
          type="button"
          (click)="goTo('/login/head-crew')"
          class="group w-full flex items-center gap-4 text-left rounded-xl border border-gray-200 bg-gray-50 px-4 py-3.5 transition hover:border-brand-500 hover:bg-brand-50 active:bg-brand-50 focus:outline-none focus-visible:ring-2 focus-visible:ring-brand-500"
        >
          <span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg bg-white text-gray-500 ring-1 ring-gray-200 transition group-hover:bg-brand-600 group-hover:text-white group-hover:ring-brand-600">
            <svg class="w-5 h-5" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
              <path d="M9 6a3 3 0 11-6 0 3 3 0 016 0zm8 0a3 3 0 11-6 0 3 3 0 016 0zM1 17a6 6 0 0112 0H1zm12 0a6 6 0 00-1.2-3.6A6 6 0 0119 17h-6z" />
            </svg>
          </span>
          <span class="flex-1 min-w-0">
            <span class="block font-semibold text-gray-900">Head Crew</span>
            <span class="block text-sm text-gray-500">Review and confirm counts</span>
          </span>
          <svg class="w-4 h-4 text-gray-300 transition group-hover:text-brand-600" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
            <path fill-rule="evenodd" d="M7.3 15.7a1 1 0 010-1.4L11.6 10 7.3 5.7a1 1 0 011.4-1.4l5 5a1 1 0 010 1.4l-5 5a1 1 0 01-1.4 0z" clip-rule="evenodd" />
          </svg>
        </button>

        <button
          type="button"
          (click)="goTo('/login/management')"
          class="group w-full flex items-center gap-4 text-left rounded-xl border border-gray-200 bg-gray-50 px-4 py-3.5 transition hover:border-brand-500 hover:bg-brand-50 active:bg-brand-50 focus:outline-none focus-visible:ring-2 focus-visible:ring-brand-500"
        >
          <span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg bg-white text-gray-500 ring-1 ring-gray-200 transition group-hover:bg-brand-600 group-hover:text-white group-hover:ring-brand-600">
            <svg class="w-5 h-5" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
              <path fill-rule="evenodd" d="M6 2a2 2 0 00-2 2v12a2 2 0 002 2h3v-3h2v3h3a2 2 0 002-2V4a2 2 0 00-2-2H6zm1 3h2v2H7V5zm4 0h2v2h-2V5zM7 9h2v2H7V9zm4 0h2v2h-2V9z" clip-rule="evenodd" />
            </svg>
          </span>
          <span class="flex-1 min-w-0">
            <span class="block font-semibold text-gray-900">Management</span>
            <span class="block text-sm text-gray-500">Oversee branches and reports</span>
          </span>
          <svg class="w-4 h-4 text-gray-300 transition group-hover:text-brand-600" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
            <path fill-rule="evenodd" d="M7.3 15.7a1 1 0 010-1.4L11.6 10 7.3 5.7a1 1 0 011.4-1.4l5 5a1 1 0 010 1.4l-5 5a1 1 0 01-1.4 0z" clip-rule="evenodd" />
          </svg>
        </button>
      </div>
    </section>
  </div>
</div>
